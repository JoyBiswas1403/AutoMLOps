[project]
name = "automlops"
version = "1.0.0"
description = "End-to-End MLOps Pipeline with MLflow, TensorFlow Serving, FastAPI, and Drift Detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joy Biswas", email = "joy@example.com" }]
requires-python = ">=3.10"
keywords = ["mlops", "mlflow", "tensorflow", "fastapi", "drift-detection", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tensorflow>=2.15.0",
    "mlflow>=2.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "prometheus-client>=0.19.0",
    "scipy>=1.11.0",
    "evidently>=0.4.0",
    "whylogs>=1.3.0",
    "pyyaml>=6.0",
    "shap>=0.43.0",
    "pandera>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "pandas-stubs>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/JoyBiswas1403/AutoMLOps"
Repository = "https://github.com/JoyBiswas1403/AutoMLOps"
Documentation = "https://github.com/JoyBiswas1403/AutoMLOps#readme"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "serving*", "drift*", "pipelines*"]

# =============================================================================
# Ruff Configuration (Linting + Formatting)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "mlruns",
    "artifacts",
    "evidently_workspace",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
]

[tool.ruff.lint.isort]
known-first-party = ["training", "serving", "drift", "pipelines"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy Configuration (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "mlruns",
    "artifacts",
    "evidently_workspace",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "mlflow.*",
    "tensorflow.*",
    "sklearn.*",
    "evidently.*",
    "whylogs.*",
    "shap.*",
    "pandera.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["training", "serving", "drift", "pipelines"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true
